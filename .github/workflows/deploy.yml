
name: Deploy Flash Sale to VPS

on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./prisma-express-typescript-boilerplate
          file: ./prisma-express-typescript-boilerplate/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flashsale-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./FE Flash Sale
          file: ./FE Flash Sale/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.netto.id.vn
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flashsale-frontend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e

            cd ${{ secrets.VPS_APP_DIR }}

            echo "=== Pulling latest Docker images ==="
            docker-compose pull

            echo "=== Recreating containers ==="
            docker-compose up -d --remove-orphans

            echo "=== Checking deployment ==="
            docker-compose ps

            echo "=== Backend image ==="
            docker inspect flashsale_backend \
              --format 'Image={{.Image}} Created={{.Created}}'

            echo "=== Deployment completed ==="
